<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAP/10 — Booba GDG</title><style>:root{--fg:#f4f4f1;--muted:#b6b8bf;--acid:#d9ff3f;--red:#ff4a45}*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--fg);font-family:Arial,Helvetica,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.phone{width:min(430px,100vw);aspect-ratio:9/16;position:relative;overflow:hidden;background:#050607;border-radius:28px;box-shadow:0 30px 100px rgba(0,0,0,.7)}#player{position:absolute;top:50%;left:50%;width:177.78%;height:100%;transform:translate(-50%,-50%) scale(1.04);border:0}.veil{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent 28%,transparent 60%,rgba(0,0,0,.78));pointer-events:none}.top{position:absolute;left:22px;right:22px;top:22px;z-index:3;display:flex;justify-content:space-between;align-items:flex-start}.logo{font-weight:1000;font-size:18px;letter-spacing:-.05em}.logo b{color:var(--acid)}.score{font-size:56px;font-weight:1000;line-height:.8;letter-spacing:-.08em;color:var(--acid)}.meta{position:absolute;left:22px;top:96px;z-index:3;opacity:0;transform:translateY(14px);transition:.35s ease}.meta.show{opacity:1;transform:none}.artist{font-size:34px;font-weight:1000;letter-spacing:-.06em}.track{font-size:15px;font-weight:800;margin-top:3px}.submeta{font-size:10px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.08em}.cap{position:absolute;left:22px;right:22px;bottom:92px;z-index:4;font-size:30px;font-weight:1000;line-height:1.02;letter-spacing:-.05em;opacity:0;transform:translateY(22px);filter:blur(6px);transition:.26s ease}.cap.show{opacity:1;transform:none;filter:none}.tag{display:inline-block;background:var(--acid);color:#090a0a;padding:4px 7px;margin-bottom:8px;font-size:9px;letter-spacing:.11em;text-transform:uppercase}.cap.bad .tag{background:var(--red);color:#fff}.cap small{display:block;margin-top:8px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:0}.final{position:absolute;inset:0;z-index:8;background:rgba(3,4,5,.86);backdrop-filter:blur(14px);display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none;transition:.35s ease}.final.show{opacity:1}.final .n{font-size:92px;font-weight:1000;letter-spacing:-.1em;color:var(--acid)}.final .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.13em;margin-top:12px}.progress{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.12);z-index:9}.progress i{display:block;height:100%;width:0;background:var(--acid)}.start{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}button{border:0;border-radius:999px;padding:16px 22px;background:var(--acid);font-weight:1000;font-size:15px;cursor:pointer}.demo{position:absolute;right:22px;bottom:28px;z-index:3;font-size:9px;color:#c9cbd0;text-transform:uppercase;letter-spacing:.12em}.pulse{animation:p .45s ease}@keyframes p{50%{transform:scale(1.08)}}@media(max-width:460px){.wrap{padding:0}.phone{width:100vw;border-radius:0}}</style></head><body><div class="wrap"><div class="phone"><div id="player"></div><div class="veil"></div><div class="top"><div class="logo">RAP<b>/10</b></div><div class="score" id="score">?/10</div></div><div class="meta" id="meta"><div class="artist">BOOBA</div><div class="track">GDG</div><div class="submeta">BLANCO NEMESIS · 2026</div></div><div class="cap" id="cap"></div><div class="demo">démo visuelle · texte provisoire</div><div class="final" id="final"><div><div class="n">7.4/10</div><div class="l">avis provisoire — le tien remplacera ça</div></div></div><div class="progress"><i id="bar"></i></div><div class="start" id="start"><button id="go">LANCER LE SHORT</button></div></div></div><script src="https://www.youtube.com/iframe_api"></script><script>let p,run=false,raf;const START=12,DUR=30,meta=document.getElementById('meta'),cap=document.getElementById('cap'),bar=document.getElementById('bar'),fin=document.getElementById('final'),score=document.getElementById('score');function onYouTubeIframeAPIReady(){p=new YT.Player('player',{videoId:'yryoa6NZ_d0',playerVars:{controls:0,rel:0,playsinline:1,modestbranding:1,start:START,iv_load_policy:3}})}function text(tag,txt,sub,bad=false){cap.className='cap show'+(bad?' bad':'');cap.innerHTML='<span class="tag">'+tag+'</span><br>'+txt+(sub?'<small>'+sub+'</small>':'')}function clear(){cap.className='cap'}function cue(t){meta.classList.toggle('show',t>1.2&&t<27);if(t<4)clear();else if(t<10)text('première écoute','ça part plus fort que je pensais','','');else if(t<18)text('ce qui marche','ici le placement colle vraiment à la prod','tu l’entends au moment où je le dis');else if(t<26)text('ce qui bloque','mais après ça, certaines formules frappent moins','la critique reste collée au passage',true);else clear();if(t>27){fin.classList.add('show');score.style.opacity=0}else{fin.classList.remove('show');score.style.opacity=1}}function loop(){if(!run)return;let t=Math.max(0,(p.getCurrentTime?p.getCurrentTime():START)-START);bar.style.width=Math.min(100,t/DUR*100)+'%';cue(t);if(t>=DUR){p.pauseVideo();run=false;fin.classList.add('show');return}raf=requestAnimationFrame(loop)}document.getElementById('go').onclick=()=>{if(!p||!p.playVideo)return;document.getElementById('start').style.display='none';p.seekTo(START,true);p.playVideo();run=true;cancelAnimationFrame(raf);loop()};</script></body></html>
