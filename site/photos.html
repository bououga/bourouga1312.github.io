img { display: block; max-width: 100%; }
a { color: inherit; }

.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 20px; }
h2 { font-weight: 800; font-size: clamp(30px, 4.6vw, 48px); line-height: 1; letter-spacing: -.02em; margin: 0; }

.new { background: var(--night); color: var(--on-night); padding-bottom: 46px; }

.new small { color: var(--on-night-soft); font-size: 14px; }

.new .go svg { width: 16px; height: 16px; margin-left: 3px; fill: var(--on-night); }
.new a:hover .go i { background: var(--accent); border-color: var(--accent); }

section.s { padding-block: 58px 62px; }
.bio { padding-top: 52px !important; }
.shows { padding-block: 50px 54px !important; }
.photos { padding-block: 44px 50px !important; }
.head { margin-bottom: 22px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }

.bio .row { display: grid; grid-template-columns: 150px minmax(0, 640px); gap: 26px; padding-block: 17px 19px; border-bottom: 1px solid var(--rule); }
.bio .when { font-weight: 700; font-size: 17px; line-height: 1.4; }

.bio-photo img { width: 100%; aspect-ratio: 4/5; object-fit: cover; object-position: 50% 20%; }

.photos { background: var(--paper-2); }
.grid { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); grid-auto-rows: 120px; gap: 8px; }
.grid figure { margin: 0; overflow: hidden; background: var(--night); }
.grid img { width: 100%; height: 100%; object-fit: cover; }
.grid .p0 { grid-column: span 4; grid-row: span 3; }
.grid .p1 { grid-column: span 2; grid-row: span 3; }
.grid .p2, .grid .p3, .grid .p4 { grid-column: span 2; grid-row: span 2; }

.grid .q { grid-column: span 2; grid-row: span 3; }

.tracks { list-style: none; margin: 0; padding: 0; columns: 2 380px; column-gap: 48px; }

.tracks .t small { display: block; font-weight: 400; font-size: 13px; color: var(--soft); margin-top: 2px; }
.tracks .t { font-weight: 600; }
.tracks .y { font-size: 14px; color: var(--soft); white-space: nowrap; }
.tracks a:hover .t { text-decoration: underline; text-underline-offset: 3px; }

.shows { background: var(--night); color: var(--on-night); }
.shows .head { border-color: var(--on-night); }
.years { columns: 3 280px; column-gap: 40px; }
.yr { break-inside: avoid; margin-bottom: 22px; }
.yr h3 { font-weight: 800; font-size: 26px; line-height: 1; margin: 0 0 6px; }
.yr ul { list-style: none; margin: 0; padding: 0; }
.yr li { padding: 6px 0 7px; border-top: 1px solid rgba(244,243,240,.14); font-size: 14px; line-height: 1.45; display: grid; gap: 2px; }
.yr .d { font-size: 13px; color: var(--on-night-soft); }

.contact .mail { font-size: clamp(18px, 3vw, 26px); font-weight: 600; margin: 0; word-break: break-all; }
.contact .mail a { text-decoration: underline; text-underline-offset: 4px; }
footer { padding-block: 22px 26px; font-size: 13px; color: var(--soft); }
footer a { text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }

.subhead h3{font-size:24px;font-weight:700;line-height:1.2;margin:22px 0 12px}#chansons{margin-top:36px}

.clip-players li{min-width:0}.clip-players a{min-height:64px}.clip-players iframe{display:block;border:0;width:100%;height:auto;aspect-ratio:16/9;background:var(--night)}
.bio-archive{max-width:640px}.bio-archive img{aspect-ratio:16/9;object-fit:contain}
.photos .grid{display:block}.photos .q{max-width:760px}.photos .q img{height:auto;aspect-ratio:16/9;object-fit:cover}

.song-player summary{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;min-height:88px;padding:16px 0;border-bottom:1px solid var(--rule);cursor:pointer;list-style:none;box-sizing:border-box}

.song-player summary:hover .t{text-decoration:underline;text-underline-offset:3px}
.song-listen{padding:14px 0 20px}.song-listen iframe{display:block;width:100%;height:auto;aspect-ratio:16/9;border:0;background:var(--night)}
.song-listen .youtube-link{display:inline-block;font-size:13px;font-weight:400;border:0;padding:8px 0;text-decoration:underline}
.new-player{max-width:760px;margin-top:20px}.new-player summary{justify-content:flex-start;gap:10px;font-weight:600}.new-player summary:before{content:'▸'}.new-player[open] summary:before{content:'▾'}

<script>
function openLinkedSong(){
  var target=document.getElementById(window.location.hash.slice(1));
  if(!target)return;
  var player=target.matches('.song-player')?target:target.querySelector('.song-player');
  if(player){player.open=true;target.scrollIntoView({block:'start'});}
}
window.addEventListener('hashchange',openLinkedSong);
document.querySelectorAll('.song-player').forEach(function(details){
  details.addEventListener('toggle',function(){
    var slot=details.querySelector('.player-slot');
    if(details.open){
      document.querySelectorAll('.song-player[open]').forEach(function(other){if(other!==details)other.open=false;});
      if(!slot.firstElementChild)slot.appendChild(details.querySelector('template').content.cloneNode(true));
    }else{slot.replaceChildren();}
  });
});
openLinkedSong();
</script>
<script>document.querySelectorAll(".menu nav a").forEach(function(a){a.addEventListener("click",function(){a.closest("details").removeAttribute("open")})})</script>
